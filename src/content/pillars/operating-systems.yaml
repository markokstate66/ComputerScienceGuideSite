title: "Operating Systems"
navTitle: "Operating Systems"
order: 8
accent:
  light: "#b91c1c"
  dark: "#fca5a5"
blurb: >-
  The operating-system concepts application developers meet every day: processes and threads, race conditions and locks, virtual memory, CPU scheduling, file systems and durability, and CPU caches. Behavior is observed from .NET code, including concurrency bugs and cache-effect measurements.
hubIntro: >-
  Operating-system concepts here are the ones an application developer actually collides with: what a process and a thread each own, the race conditions and deadlocks that follow from sharing memory across threads, virtual memory and paging, how the scheduler decides whose turn it is, how a file system survives a crash, and what a CPU cache line really costs. Processes and threads comes first because every other article assumes you know what's shared and what's private between them. Concurrency and virtual memory come next, building directly on what threads share and what processes don't; scheduling, file systems and the memory hierarchy are the deeper, occasionally advanced, material.
readingNotes:
  processes-and-threads: >-
    Opens the pillar with what a process and a thread each own, the fact every later article about scheduling, memory or locking depends on.
  concurrency-race-conditions-locks: >-
    Follows directly because the shared heap the first article described is exactly what makes two threads able to corrupt a counter without a lock.
  virtual-memory: >-
    Builds on processes and threads to explain the private address space each process gets, the isolation the first article showed with a write a child process never sees.
  cpu-scheduling: >-
    Builds on processes and threads for its vocabulary and returns to the context-switch cost measured there, this time comparing five algorithms that decide when a switch happens.
  file-systems: >-
    Picks up where virtual memory's mapped-file section stops: what a file is on the disk side of a page fault, and what it takes for a write to survive a crash.
  memory-hierarchy-and-caches: >-
    Placed last and marked advanced; its false-sharing example slows two threads that share no data at all, a cost the article separates from the race conditions covered earlier.
