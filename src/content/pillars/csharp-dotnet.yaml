blurb: >-
  What the C# compiler and the .NET runtime do with your code: value and reference types, the garbage collector, the state machine behind async and await, deferred execution in LINQ, generics and variance, strings and Unicode, exceptions, and Span<T>. The articles rely on experiments you can run yourself, including allocation measurements and deliberate compile errors.
