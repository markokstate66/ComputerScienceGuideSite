title: "Software Testing"
navTitle: "Testing"
order: 10
accent:
  light: "#4d7c0f"
  dark: "#bef264"
blurb: >-
  How to test code so that the tests are worth having: unit-test structure with xUnit, test doubles, a complete test-driven development example, integration tests, property-based testing, and what a code-coverage number does and does not tell you.
hubIntro: >-
  Testing is covered here as a practical skill, not a rulebook: how to write a unit test that actually proves something with xUnit, the five kinds of test double and when a mock is the wrong choice, a complete test-driven development example built lap by lap, where unit tests stop and integration tests start, letting a computer generate edge cases instead of writing them by hand, and what a coverage percentage does and doesn't tell you. Read unit-testing-fundamentals first regardless of background; everything else in the pillar assumes you can already write and run one.
readingNotes:
  unit-testing-fundamentals: >-
    Opens the pillar because Arrange-Act-Assert and a runnable xUnit test are what every later article's examples are built on.
  test-doubles: >-
    Follows directly because stubbing out a collaborator only makes sense once you can already write the test around it, which the first article covers.
  test-driven-development: >-
    Needs both unit testing and test doubles already covered, since its five red-green-refactor laps write real xUnit tests against real collaborators.
  testing-pyramid-and-integration-tests: >-
    Builds on test doubles specifically to ask when mocking a repository is the wrong call and a real SQLite-backed integration test is better.
  property-based-testing: >-
    Comes after the pyramid article because it targets the same kind of example-based unit tests covered earlier, showing what a generated input finds that seven handwritten ones missed.
  code-coverage: >-
    Closes the pillar because judging what a coverage number means requires already knowing, from every earlier article, what a good test actually checks.
