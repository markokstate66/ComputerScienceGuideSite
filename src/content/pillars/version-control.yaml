blurb: >-
  Git explained from its object model outwards: blobs, trees, commits and refs, then branching, merging and conflicts, rebase, undoing mistakes, and team workflows. Every command sequence shown is executed in a scratch repository by the verification tool before publication, so the output you see is the output Git really produced.
