title: "Version Control with Git"
navTitle: "Version Control"
order: 9
accent:
  light: "#c2410c"
  dark: "#fdba74"
blurb: >-
  Git explained from its object model outwards: blobs, trees, commits and refs, then branching, merging and conflicts, rebase, undoing mistakes, and team workflows. Every command sequence runs in a scratch repository before publication, so the output you see is the output Git really produced.
hubIntro: >-
  Git is explained here from the inside out: first the object model, blobs, trees, commits and refs, built by hand with plumbing commands, then the everyday operations, branching, merging, rebasing and undoing mistakes, that manipulate those objects, and finally the team workflows built on top of all of it. Start with how Git works internally even if you already use Git daily; the later articles on merge conflicts, rebase and reflog make far more sense once a branch is just a 41-byte pointer rather than a metaphor. Git workflows at the end assumes you're comfortable with the four operations covered before it.
readingNotes:
  how-git-works: >-
    Opens the pillar with the object model, blobs, trees, commits and refs, that every later article's explanations of branching and rebasing depend on.
  branching-and-merging: >-
    Follows directly because a fast-forward or three-way merge is best understood as an operation on the commit graph just introduced, not as a separate mechanism.
  rebase-vs-merge: >-
    Needs merging already covered so the same diverged branches can be merged twice, once each way, and the resulting graphs compared directly.
  undoing-things-in-git: >-
    Comes after merging and rebasing because several of its five mistakes, like a bad merge or a lost commit after a rebase, only exist once you can do both.
  git-workflows: >-
    Closes the pillar because choosing trunk-based development, GitHub Flow or Git Flow assumes you're already comfortable with the branching, merging and rebasing covered before it.
