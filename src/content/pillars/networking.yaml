blurb: >-
  What happens between typing a URL and seeing a page: DNS, IP addressing and subnets, TCP and UDP, HTTP, and TLS. Each protocol is explained from its specification and then exercised from C# with sockets, TcpClient and SslStream, so you can watch the bytes instead of memorising a layer diagram.
