title: "Object-Oriented Design and Patterns"
navTitle: "OOP and Design"
order: 4
accent:
  light: "#be185d"
  dark: "#f9a8d4"
blurb: >-
  Object-oriented programming through the problems it solves: protecting invariants, virtual dispatch, the cost of inheritance, SOLID and where it's over-applied, patterns already in the BCL, and the DI lifetimes that replaced Singleton. Examples use billing and game domains, not animal hierarchies.
hubIntro: >-
  Object-oriented programming is presented here as a set of answers to specific problems, protecting invariants, avoiding rigid class hierarchies, wiring up dependencies, rather than as vocabulary to memorize. The seven articles move from the four pillars themselves through a real refactor away from inheritance, the SOLID principles and where they get overused, the choice between an interface and an abstract class, and the design patterns already hiding in the .NET base class library, ending with dependency injection, whose singleton lifetime replaces the classic Singleton pattern. Read the four pillars article first regardless of experience; everything after it assumes you know what encapsulation and polymorphism are actually doing at run time.
readingNotes:
  four-pillars-of-oop: >-
    Opens the pillar because every later article assumes you know what encapsulation, polymorphism, inheritance and abstraction mean at the level of a virtual call, not just the definitions.
  composition-over-inheritance: >-
    Follows immediately, turning the inheritance costs the first article describes into an enemy class hierarchy that breaks when a flying archer is requested.
  solid-principles: >-
    Follows the four pillars article, which already names the Liskov substitution principle for a broken postcondition; here it gets a real BCL violation and four more principles beside it.
  interfaces-vs-abstract-classes: >-
    Comes after SOLID because its advice on when a small interface beats a slice of an abstract class is a narrower form of the interface segregation principle.
  strategy-observer-decorator: >-
    Builds directly on interfaces vs. abstract classes: Strategy and Observer swap behavior through interfaces, but Decorator here composes by extending the same abstract Stream class each layer inherits from.
  factory-builder-singleton: >-
    Follows the pattern article because Factory and Builder solve a different problem, object creation, and it closes with Singleton, what a global instance costs a test suite, and the DI lifetime that replaced it.
  dependency-injection: >-
    Closes the pillar by wiring dependencies in by hand and then with a container, whose singleton lifetime is a registration policy rather than the Singleton pattern of the previous article.
